<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kesiapsiagaan Gempa Bumi & Tsunami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10233A;
    --paper:#EEF2F4;
    --card:#FFFFFF;
    --slate:#55677A;
    --amber:#E8A33D;
    --amber-tint:#FBF0DC;
    --teal:#2C6E7F;
    --teal-tint:#E4EFF1;
    --hairline:#DCE3E8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 12% -10%, rgba(44,110,127,.10), transparent 42%),
      radial-gradient(circle at 100% 0%, rgba(232,163,61,.08), transparent 38%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:880px; margin:0 auto; padding:64px 24px 80px; }

  .eyebrow{
    display:flex; align-items:center; gap:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--teal); margin:0 0 14px;
  }
  .eyebrow::before{
    content:''; width:16px; height:2px; background:var(--amber); display:inline-block;
  }
  h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; text-transform:uppercase;
    font-size:clamp(34px,7vw,56px);
    line-height:1.02; margin:0 0 16px; letter-spacing:.01em;
  }
  .subtitle{ color:var(--slate); font-size:15.5px; max-width:56ch; margin:0 0 20px; line-height:1.55; }

  .stat-bar{
    display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center;
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink);
    margin:0 0 28px;
  }
  .stat-bar strong{ color:var(--teal); }
  .stat-dot{ width:4px; height:4px; border-radius:50%; background:var(--hairline); }

  .hero{ position:relative; }
  .seismo{
    position:absolute; top:-18px; right:-10px; width:300px; max-width:46%;
    height:auto; z-index:-1; opacity:.16; color:var(--teal);
  }

  .hazard{
    height:6px; width:100%; border-radius:3px; margin:0 0 48px;
    background:repeating-linear-gradient(135deg, var(--amber) 0 14px, var(--ink) 14px 28px);
  }

  .section{ margin-bottom:52px; }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:0 0 20px; padding-bottom:12px; border-bottom:1px solid var(--hairline);
  }
  h2.section-title{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    font-size:21px; color:var(--ink); margin:0;
  }
  .section-count{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--slate);
  }

  .video-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:20px; }
  .video-card{
    display:block; background:var(--card); border:1px solid var(--hairline); border-radius:12px;
    overflow:hidden; text-decoration:none; color:inherit;
    box-shadow:0 1px 2px rgba(16,35,58,.04);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .video-card:hover, .video-card:focus-visible{
    transform:translateY(-4px);
    box-shadow:0 16px 32px rgba(16,35,58,.14);
    border-color:var(--teal);
  }
  .thumb{ position:relative; aspect-ratio:16/9; background:var(--ink); }
  .thumb.thumb-fallback{ background:linear-gradient(135deg, var(--ink), var(--teal)); }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(16,35,58,0) 55%, rgba(16,35,58,.55) 100%);
  }
  .play{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1;
  }
  .play span{
    width:48px; height:48px; border-radius:50%;
    background:var(--amber); display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    transition:transform .18s ease;
  }
  .video-card:hover .play span{ transform:scale(1.08); }
  .play svg{ width:17px; height:17px; margin-left:2px; }
  .video-meta{ padding:14px 16px 16px; }
  .video-tag{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--teal); letter-spacing:.08em; text-transform:uppercase; }
  .video-title{ font-size:14px; font-weight:500; margin-top:5px; line-height:1.35; }
  .video-tip{
    display:flex; gap:8px; align-items:flex-start;
    font-size:12.5px; color:var(--slate); line-height:1.5;
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--hairline);
  }
  .video-tip .dot{ flex-shrink:0; width:6px; height:6px; border-radius:50%; background:var(--amber); margin-top:5px; }

  .doc-list{ display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:14px; align-items:stretch; }
  .doc-card{
    display:flex; align-items:center; gap:16px; height:100%;
    background:var(--card); border:1px solid var(--hairline); border-radius:12px;
    padding:16px 18px; text-decoration:none; color:inherit;
    box-shadow:0 1px 2px rgba(16,35,58,.04);
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .doc-card:hover, .doc-card:focus-visible{
    border-color:var(--teal); transform:translateX(4px);
    box-shadow:0 10px 22px rgba(16,35,58,.10);
  }
  .doc-icon{
    flex-shrink:0; width:42px; height:42px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--teal-tint); color:var(--teal);
  }
  .doc-icon.official{ background:var(--amber-tint); color:#9C6B1D; }
  .doc-body{ flex:1; min-width:0; }
  .doc-type{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--teal); letter-spacing:.08em; text-transform:uppercase; }
  .doc-icon.official ~ .doc-body .doc-type{ color:#9C6B1D; }
  .doc-title{ font-size:14.5px; font-weight:500; margin-top:3px; line-height:1.35; }
  .doc-source{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate); margin-top:4px; text-transform:uppercase; letter-spacing:.05em; }
  .doc-arrow{ color:var(--slate); font-family:'IBM Plex Mono',monospace; flex-shrink:0; }

  footer{ font-size:12px; color:var(--slate); text-align:center; padding-top:8px; border-top:1px solid var(--hairline); }

  a:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    .video-card, .doc-card, .play span{ transition:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <svg class="seismo" viewBox="0 0 300 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,50 L40,50 L48,18 L56,82 L64,28 L72,68 L80,50 L110,50 L118,24 L126,76 L134,42 L142,58 L150,50 L300,50" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <p class="eyebrow">Referensi</p>
      <h1>Kesiapsiagaan Gempa Bumi & Tsunami</h1>
      <p class="subtitle">Kumpulan video edukasi dan dokumen panduan resmi seputar mitigasi dan kesiapsiagaan bencana gempa bumi serta tsunami.</p>
      <div class="stat-bar">
        <span><strong id="videoStat"></strong> Video Edukasi</span>
        <span class="stat-dot"></span>
        <span><strong id="docStat"></strong> Dokumen & Sumber</span>
      </div>
    </div>
    <div class="hazard"></div>

    <div class="section">
      <div class="section-head">
        <h2 class="section-title">Video Edukasi</h2>
        <span class="section-count" id="videoCount"></span>
      </div>
      <div class="video-grid" id="videoGrid"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2 class="section-title">Dokumen & Panduan</h2>
        <span class="section-count" id="docCount"></span>
      </div>
      <div class="doc-list" id="docList"></div>
    </div>

    <footer>Terakhir diperbarui: <span id="lastUpdated"></span></footer>
  </div>

<script>
  const videos = [
    { id: "gnXosx0znS4", tag: "Sebelum", title: "Mitigasi Bencana Gempa Bumi - Sebelum Terjadinya Gempa Bumi", tip: "Siapkan tas siaga bencana dan kenali jalur evakuasi terdekat." },
    { id: "xPWgX7hf9Pk", tag: "Saat", title: "Mitigasi Bencana Gempa Bumi - Saat Terjadi Gempa Bumi", tip: "Lindungi kepala, merunduk, dan berpegangan pada benda kokoh." },
    { id: "HMUOu8MqvmU", tag: "Sesudah", title: "Mitigasi Bencana Gempa Bumi - Sesudah Terjadi Gempa Bumi", tip: "Periksa sekitar dengan hati-hati dan waspadai gempa susulan." },
  ];

  const docs = [
    {
      title: "Buku Saku Tanggap, Tangkas, Tangguh Menghadapi Bencana",
      type: "Buku Saku",
      source: "Google Drive",
      url: "https://drive.google.com/file/d/1qQ-wOQc-E1Kj4BSY4rwBlgjGsQA31cbw/view?usp=drivesdk"
    },
    {
      title: "Pedoman Kesiapsiagaan Menghadapi Gempa Bumi dan Tsunami",
      type: "Panduan",
      source: "ResearchGate",
      url: "https://www.researchgate.net/publication/322095200_Pedoman_Kesiapsiagaan_Menghadapi_Gempa_Bumi_dan_Tsunami"
    },
    {
      title: "Strategi Antisipasi Bencana Alam untuk Meningkatkan Kesiapsiagaan Masyarakat",
      type: "Artikel",
      source: "Google Drive",
      url: "https://drive.google.com/file/d/1YNJIlz4mzv3W5jZ-Gg9B3SfngHOLqjFl/view?usp=drivesdk"
    },
    {
      title: "Jurnal Peningkatan Kesiapsiagaan Masyarakat",
      type: "Jurnal",
      source: "Google Drive",
      url: "https://drive.google.com/file/d/15ZI54ct5iJyuKeMAao6wmJ-wBEqRTKmG/view?usp=drivesdk"
    },
    {
      title: "Materi Pendukung Kesiapsiagaan Bencana",
      type: "Materi Pendukung",
      source: "Google Drive",
      url: "https://drive.google.com/file/d/1DY8kzj1gC8at93nRYv4rqlOJrUqVtK2D/view?usp=drivesdk"
    },
    {
      title: "Badan Nasional Penanggulangan Bencana (BNPB)",
      type: "Situs Resmi",
      source: "BNPB",
      official: true,
      url: "https://www.bnpb.go.id/sejarah-bnpb"
    },
  ];

  const docIcons = {
    "ResearchGate": '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16h6M9 10h3"/></svg>',
    "Google Drive": '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3l8 0 5 9-4 8H7L3 12z"/></svg>',
    "BNPB": '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l8 4v5c0 5-3.4 8.4-8 9.5C7.4 20.4 4 17 4 12V7z"/><path d="M9 12l2 2 4-4"/></svg>'
  };

  const grid = document.getElementById('videoGrid');
  videos.forEach(v => {
    const card = document.createElement('a');
    card.className = 'video-card';
    card.href = `https://www.youtube.com/watch?v=${v.id}`;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.innerHTML = `
      <div class="thumb">
        <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy"
             onerror="this.onerror=null;this.style.display='none';this.parentElement.classList.add('thumb-fallback');">
        <div class="play"><span>
          <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        </span></div>
      </div>
      <div class="video-meta">
        <div class="video-tag">${v.tag}</div>
        <div class="video-title">${v.title}</div>
        <div class="video-tip"><span class="dot"></span><span>${v.tip}</span></div>
      </div>`;
    grid.appendChild(card);
  });

  const docList = document.getElementById('docList');
  docs.forEach(d => {
    const a = document.createElement('a');
    a.className = 'doc-card';
    a.href = d.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.innerHTML = `
      <div class="doc-icon${d.official ? ' official' : ''}">${docIcons[d.source] || ''}</div>
      <div class="doc-body">
        <div class="doc-type">${d.type}</div>
        <div class="doc-title">${d.title}</div>
        <div class="doc-source">${d.source}</div>
      </div>
      <div class="doc-arrow">&#8594;</div>`;
    docList.appendChild(a);
  });

  document.getElementById('videoCount').textContent = String(videos.length).padStart(2, '0');
  document.getElementById('docCount').textContent = String(docs.length).padStart(2, '0');
  document.getElementById('videoStat').textContent = videos.length;
  document.getElementById('docStat').textContent = docs.length;
  document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
</script>
</body>
</html>
